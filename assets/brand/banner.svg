<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Subtext 言外：双语输入法，读得懂潜台词，写得出地道话">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F5240"/>
      <stop offset="1" stop-color="#14281F"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <!-- 标志 -->
  <g transform="translate(34.8 -5) scale(0.30)">
    <path d="M300 250 H724 A96 96 0 0 1 820 346 V588 A96 96 0 0 1 724 684 H470 L336 790 V684 H300 A96 96 0 0 1 204 588 V346 A96 96 0 0 1 300 250 Z" fill="#F5F7F2"/>
    <rect x="300" y="360" width="424" height="52" rx="26" fill="#1E3A2C"/>
    <rect x="300" y="472" width="268" height="52" rx="26" fill="#B0CE7D"/>
  </g>
  <text x="96" y="296" font-family="-apple-system,'SF Pro Display','PingFang SC','Helvetica Neue',sans-serif" font-size="68" font-weight="700" fill="#F5F7F2" letter-spacing="-1">Subtext 言外</text>
  <text x="98" y="340" font-family="-apple-system,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif" font-size="26" fill="#B0CE7D">双语输入法：读得懂潜台词，写得出地道话。</text>
  <!-- 右侧：一张迷你解码卡片 -->
  <g transform="translate(700 64)">
    <rect width="500" height="272" rx="18" fill="#F5F7F2" opacity="0.97"/>
    <text x="28" y="48" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#6B7A70">解码</text>
    <text x="72" y="48" font-family="-apple-system,'PingFang SC',sans-serif" font-size="17" fill="#1E3A2C">同事在催你，但催得很客气</text>
    <text x="28" y="96" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="21" font-weight="600" fill="#14281F">no rush at all</text>
    <text x="196" y="96" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" fill="#2F8A9A">软化 / 套话</text>
    <text x="28" y="126" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" fill="#3A4A40">真不急的人，不会专门提这一句</text>
    <text x="28" y="172" font-family="-apple-system,'SF Pro Text',sans-serif" font-size="21" font-weight="600" fill="#14281F">lmk</text>
    <text x="84" y="172" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" fill="#E07A1F">缩写</text>
    <text x="28" y="202" font-family="-apple-system,'PingFang SC',sans-serif" font-size="16" fill="#3A4A40">let me know，聊天里的「回我一声」</text>
    <rect x="20" y="222" width="460" height="32" rx="8" fill="#B0CE7D" opacity="0.45"/>
    <text x="32" y="244" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" fill="#14281F">语气 · casual　友好，但带一点 deadline 压力</text>
  </g>
</svg>
