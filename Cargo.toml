[workspace]
resolver = "3"
members = [
    "crates/subtext-coach",
    "apps/coach",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/StarryGuli/subtext"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# 内部 crate
subtext-coach = { path = "crates/subtext-coach" }

# 外部依赖统一在这里定版本，子 crate 一律 `xxx.workspace = true`
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
serde_json = "1.0.151"
toml = "1.1.5"
dotenvy = "0.15.7"
reqwest = { version = "0.13", default-features = false }

# macOS 平台层
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSAttributedString", "NSBundle", "NSDictionary", "NSGeometry", "NSObject", "NSProcessInfo", "NSRange", "NSString", "NSTimer", "NSValue"] }
objc2-app-kit = { version = "0.3.2", features = ["NSBox", "NSApplication", "NSAttributedString", "NSEvent", "NSBitmapImageRep", "NSColor", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSMenu", "NSMenuItem", "NSPasteboard", "NSTextField", "NSTextFieldCell", "NSActionCell", "NSRunningApplication", "NSText", "NSButton", "NSButtonCell", "NSControl", "NSStringDrawing", "NSView", "NSWindow", "NSScrollView", "NSClipView", "NSTextView", "NSParagraphStyle", "block2"] }
